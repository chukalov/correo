<h1>Correo</h1>
<p>Cliente de correo de escritorio para Linux, de uso personal. Corre en la
computadora de su dueño y sincroniza las cuentas de Google que él mismo
autoriza (IMAP y SMTP con OAuth) a una carpeta local, para leerlas,
buscarlas y responderlas sin conexión.</p>
